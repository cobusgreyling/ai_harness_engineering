<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>

  <!-- Decorative connection lines between components -->
  <g stroke="url(#accent)" stroke-width="2" opacity="0.3" fill="none" filter="url(#softglow)">
    <path d="M 250 280 Q 350 240 450 280"/>
    <path d="M 450 280 Q 550 240 650 280"/>
    <path d="M 650 280 Q 750 240 850 280"/>
    <path d="M 150 280 Q 200 260 250 280"/>
    <path d="M 850 280 Q 950 260 1000 280"/>
  </g>

  <!-- Animated dots on connection lines -->
  <circle cx="350" cy="255" r="3" fill="#3b82f6" opacity="0.6"/>
  <circle cx="550" cy="255" r="3" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="750" cy="255" r="3" fill="#3b82f6" opacity="0.6"/>

  <!-- Title -->
  <text x="600" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#f8fafc" text-anchor="middle" filter="url(#glow)">Agent Harness Engineering</text>

  <!-- Subtitle -->
  <text x="600" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">Six components that govern how an AI agent operates</text>

  <!-- Accent line under subtitle -->
  <rect x="420" y="128" width="360" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Component boxes -->
  <!-- 1. ToolRegistry -->
  <g transform="translate(105, 160)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <rect width="150" height="3" rx="1.5" fill="#3b82f6" opacity="0.8"/>
    <text x="75" y="35" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="600">ToolRegistry</text>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">6 tools registered</text>
    <text x="75" y="72" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">calculator, search...</text>
  </g>

  <!-- 2. MemoryManager -->
  <g transform="translate(280, 160)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
    <rect width="150" height="3" rx="1.5" fill="#8b5cf6" opacity="0.8"/>
    <text x="75" y="35" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle" font-weight="600">MemoryManager</text>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Working memory</text>
    <text x="75" y="72" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">store / recall / clear</text>
  </g>

  <!-- 3. ContextEngine -->
  <g transform="translate(455, 160)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <rect width="150" height="3" rx="1.5" fill="#3b82f6" opacity="0.8"/>
    <text x="75" y="35" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="600">ContextEngine</text>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Dynamic prompts</text>
    <text x="75" y="72" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">system + tools + mem</text>
  </g>

  <!-- 4. Planner -->
  <g transform="translate(630, 160)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
    <rect width="150" height="3" rx="1.5" fill="#8b5cf6" opacity="0.8"/>
    <text x="75" y="35" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle" font-weight="600">Planner</text>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Task decomposition</text>
    <text x="75" y="72" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">LLM-driven steps</text>
  </g>

  <!-- 5. Verifier -->
  <g transform="translate(805, 160)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.9"/>
    <rect width="150" height="3" rx="1.5" fill="#3b82f6" opacity="0.8"/>
    <text x="75" y="35" font-family="monospace" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="600">Verifier</text>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Rule-based checks</text>
    <text x="75" y="72" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">+ retry on failure</text>
  </g>

  <!-- 6. HarnessConfig -->
  <g transform="translate(980, 160)">
    <rect width="150" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <rect width="150" height="3" rx="1.5" fill="#10b981" opacity="0.8"/>
    <text x="75" y="35" font-family="monospace" font-size="11" fill="#10b981" text-anchor="middle" font-weight="600">HarnessConfig</text>
    <text x="75" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Toggle ON/OFF</text>
    <text x="75" y="72" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">modular control</text>
  </g>

  <!-- Bottom feature badges -->
  <g transform="translate(160, 310)">
    <rect width="130" height="30" rx="15" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="65" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">6 Tools</text>
  </g>
  <g transform="translate(310, 310)">
    <rect width="130" height="30" rx="15" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <text x="65" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Self-Correction</text>
  </g>
  <g transform="translate(460, 310)">
    <rect width="130" height="30" rx="15" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="65" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Token Tracking</text>
  </g>
  <g transform="translate(610, 310)">
    <rect width="130" height="30" rx="15" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <text x="65" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Audit Log</text>
  </g>
  <g transform="translate(760, 310)">
    <rect width="130" height="30" rx="15" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="65" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Comparison Mode</text>
  </g>
  <g transform="translate(910, 310)">
    <rect width="130" height="30" rx="15" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="65" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Gradio GUI</text>
  </g>

  <!-- Bottom line -->
  <text x="600" y="375" font-family="system-ui, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Powered by NVIDIA Nemotron Super 49B</text>
</svg>
